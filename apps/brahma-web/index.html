<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>brahma</title>
  <link data-trunk rel="copy-file" href="favicon.png" />
  <link data-trunk rel="copy-file" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#141310">
  <link data-trunk rel="rust" data-bin="brahma-web" data-cargo-profile="wasm-release" data-cargo-features="heif" data-wasm-opt="z" data-wasm-opt-params="--converge" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #141310; }
    #brahma_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #brahma_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 16px; text-align: center; color: #b2aea4; font: 14px system-ui, sans-serif; pointer-events: none; }
    #brahma_loading p { margin: 0 0 8px; max-width: 420px; line-height: 1.5; }
    #brahma_loading a { color: #c9a85a; pointer-events: auto; }
    /* The app removes this element once it runs. If the WebAssembly never downloads or doesn't match
       this page, no Rust runs to say so, so the page itself shows what to do after a while. */
    #brahma_stalled { color: #7e7a70; visibility: hidden; animation: brahma-stalled 0s 20s forwards; }
    @keyframes brahma-stalled { to { visibility: visible; } }
  </style>
</head>
<body>
  <canvas id="brahma_canvas"></canvas>
  <div id="brahma_loading">
    <p>Loading brahma&hellip;</p>
    <p id="brahma_stalled">This is taking longer than usual. If brahma doesn't start, its files may have failed to
      download or come from a different version of this page. <a href="">Reload</a> to try again; the browser
      console lists what failed.</p>
  </div>
</body>
</html>
