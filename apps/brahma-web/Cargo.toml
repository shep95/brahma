[package]
name = "brahma-web"
description = "Brahma in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Open HEIC/HEIF photos (the optional brahma-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["brahma-codecs/heif"]

[lints]
workspace = true

[[bin]]
name = "brahma-web"
path = "src/main.rs"

[dependencies]
brahma-engine = { workspace = true }
brahma-cms = { workspace = true }
brahma-io = { workspace = true }
brahma-codecs = { workspace = true }
brahma-doc = { workspace = true }
brahma-format = { workspace = true }
brahma-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["wgpu", "accesskit"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Location", "CssStyleDeclaration", "Storage", "Event", "EventTarget", "MouseEvent", "PointerEvent", "BeforeUnloadEvent", "AbortController", "AbortSignal", "DomException", "Response", "IdbFactory", "IdbOpenDbRequest", "IdbDatabase", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbObjectStore", "IdbCursor", "IdbCursorWithValue", "RequestInit", "Navigator", "Headers", "ClipboardEvent", "DataTransfer", "DataTransferItemList", "DataTransferItem", "File", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "Url", "ReadableStream", "ReadableStreamDefaultReader", "MediaQueryList"] }

[dev-dependencies]
serde_json = { workspace = true }
brahma-paint = { workspace = true }
brahma-psd = { workspace = true }
