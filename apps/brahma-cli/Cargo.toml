[package]
name = "brahma-cli"
description = "Headless Brahma: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional brahma-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["brahma-codecs/heif"]

[lints]
workspace = true

[lib]
name = "brahma_cli"
path = "src/lib.rs"

[[bin]]
name = "brahma-cli"
path = "src/main.rs"

[dependencies]
brahma-automation = { path = "../../crates/automation" }
brahma-engine = { workspace = true }
brahma-io = { workspace = true }
brahma-format = { path = "../../crates/format" }
brahma-codecs = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
# Icon + VERSIONINFO for brahma-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

